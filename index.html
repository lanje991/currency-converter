```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>USD to SOS Converter</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

    <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">
      Currency Converter
    </h1>

    <p class="text-center text-gray-500 mb-8">
      USD ↔ Somaliland Shilling
    </p>

    <!-- Amount -->
    <label class="block font-semibold mb-2">
      Amount
    </label>

    <input
      id="amount"
      type="number"
      placeholder="Enter amount"
      class="w-full border rounded-lg p-3 mb-5 outline-none focus:ring-2 focus:ring-blue-500"
    >

    <!-- From -->
    <label class="block font-semibold mb-2">
      From
    </label>

    <select
      id="from"
      class="w-full border rounded-lg p-3 mb-5"
    >
      <option value="USD">🇺🇸 USD - US Dollar</option>
      <option value="SOS">🇸🇴 SOS - Somaliland Shilling</option>
    </select>

    <!-- To -->
    <label class="block font-semibold mb-2">
      To
    </label>

    <select
      id="to"
      class="w-full border rounded-lg p-3 mb-6"
    >
      <option value="SOS">🇸🇴 SOS - Somaliland Shilling</option>
      <option value="USD">🇺🇸 USD - US Dollar</option>
    </select>

    <!-- Button -->
    <button
      id="convertBtn"
      class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700"
    >
      Convert
    </button>

    <!-- Result -->
    <div
      id="result"
      class="mt-6 bg-blue-50 text-blue-700 p-5 rounded-lg text-center text-xl font-bold"
    >
      Result will appear here
    </div>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
```
